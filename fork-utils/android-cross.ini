#
# Cross file for building systemd for Android (aarch64) with the Android NDK.
#
# No machine-specific paths: the repository root is resolved by Meson itself
# via the @GLOBAL_SOURCE_ROOT@ token, and the NDK location can be adjusted in
# the [constants] section below.

[constants]
ndk_path = '/opt/android-ndk'
ndk_clang = ndk_path / 'toolchains/llvm/prebuilt/linux-x86_64/bin'
repo_root = '@GLOBAL_SOURCE_ROOT@'
android_sysroot = repo_root / 'sysroot'
android_api = '35'

[binaries]
c   = ndk_clang / ('aarch64-linux-android' + android_api + '-clang')
cpp = ndk_clang / ('aarch64-linux-android' + android_api + '-clang++')
ar  = ndk_clang / 'llvm-ar'
strip = ndk_clang / 'llvm-strip'
ranlib = ndk_clang / 'llvm-ranlib'
# Point pkg-config at the repository sysroot so host libraries never leak
# into the cross build. Optional dependencies are simply not found when the
# sysroot is empty or absent.
pkg-config = ['env', 'PKG_CONFIG_LIBDIR=' + android_sysroot / 'usr/lib/pkgconfig', 'pkg-config']

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'armv8-a'
endian = 'little'

[built-in options]
c_args = ['-D_GNU_SOURCE', '-isystem', android_sysroot / 'usr/include']
cpp_args = ['-D_GNU_SOURCE', '-isystem', android_sysroot / 'usr/include']

[properties]
needs_exe_wrapper = true
