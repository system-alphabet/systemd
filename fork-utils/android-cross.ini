[constants]
ndk_path = '/opt/android-ndk'
ndk_clang = ndk_path / 'toolchains/llvm/prebuilt/linux-x86_64/bin'

[binaries]
c   = ndk_clang / 'aarch64-linux-android35-clang'
cpp = ndk_clang / 'aarch64-linux-android35-clang++'
ar  = ndk_clang / 'llvm-ar'
strip = ndk_clang / 'llvm-strip'
ranlib = ndk_clang / 'llvm-ranlib'
pkg-config = ['env', 'PKG_CONFIG_LIBDIR=/home/chenpi11/Projects/systema/systemd/sysroot/usr/lib/pkgconfig', '/usr/bin/pkg-config']

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'armv8-a'
endian = 'little'

[built-in options]
c_args = ['-D_GNU_SOURCE', '-isystem', '/home/chenpi11/Projects/systema/systemd/sysroot/usr/include']
cpp_args = ['-D_GNU_SOURCE', '-isystem', '/home/chenpi11/Projects/systema/systemd/sysroot/usr/include']

[properties]
needs_exe_wrapper = true